<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MO9 Rood — Team-app</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MO9 Rood">
<style>
  :root{
    --rood:#A32D2D;--rood-donker:#791F1F;--rood-licht:#FCEBEB;
    --zwart:#1a1a1a;--goud:#E3A72E;
    --groen:#639922;--groen-tekst:#fff;
    --groen-licht:#EAF3DE;--groen-licht-tekst:#3B6D11;--groen-licht-rand:#C0DD97;
    --rood-chip:#F09595;--rood-chip-tekst:#501313;--rood-chip-rand:#E24B4A;
    --tekst:#1c1c1c;--grijs:#5f5f5f;--lichtgrijs:#8a8a8a;
    --lijn:#e7e3da;--vlak:#fff;--pagina:#f4f3f0;--zacht:#faf9f6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--pagina);color:var(--tekst);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;background:var(--vlak);min-height:100vh;padding-bottom:74px}
  header{background:var(--zwart);color:#fff;padding:14px 18px;border-bottom:4px solid var(--goud);
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
  header img{height:38px}
  header .t{flex:1;min-width:0}
  header .t .k{font-size:11px;letter-spacing:.06em;color:var(--goud);text-transform:uppercase}
  header .t h1{font-size:17px;font-weight:600}
  header button.uit{background:transparent;border:1px solid #555;color:#ddd;border-radius:8px;font-size:12px;padding:6px 10px;cursor:pointer}
  main{padding:18px}
  h2{font-size:15px;font-weight:600;margin:20px 0 10px}
  h2:first-child{margin-top:4px}
  .kaart{background:var(--vlak);border:1px solid var(--lijn);border-radius:14px;padding:14px 15px;margin-bottom:12px}
  .kaart.afg{opacity:.6}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--lijn);border-radius:9px;font-size:15px;background:#fff;color:var(--tekst);margin-top:8px;font-family:inherit}
  textarea{min-height:120px;resize:vertical}
  label.veldlbl{font-size:12px;color:var(--grijs);margin-top:10px;display:block}
  .knop{display:inline-block;width:100%;background:var(--rood);color:#fff;border:none;border-radius:9px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:12px;text-align:center;text-decoration:none}
  .knop.grijs{background:#eceae5;color:#333}
  .knop.google{background:#fff;color:#1c1c1c;border:1px solid var(--lijn)}
  .knop.uitlijn{background:var(--goud);color:#3a2a00}
  .link{color:var(--rood);text-decoration:none;font-size:14px;cursor:pointer}
  .fout{color:var(--rood-donker);background:var(--rood-licht);border-radius:8px;padding:9px 11px;font-size:13px;margin-top:12px}
  .meld{color:var(--groen-licht-tekst);background:var(--groen-licht);border-radius:8px;padding:9px 11px;font-size:13px;margin-top:12px}
  .rij-item{display:flex;align-items:center;gap:12px;cursor:pointer}
  .datum{text-align:center;min-width:44px}
  .datum .d{font-size:19px;font-weight:600;line-height:1}
  .datum .m{font-size:11px;color:var(--lichtgrijs);text-transform:uppercase}
  .info{flex:1;min-width:0}
  .info .titel{font-size:15px;font-weight:600}
  .info .sub{font-size:13px;color:var(--grijs)}
  .pijl{color:var(--lichtgrijs)}
  .tag-afg{font-size:11px;background:#e2ded7;color:#6b6b6b;padding:2px 8px;border-radius:20px;margin-left:6px}
  .tel{display:flex;gap:8px;margin-top:12px;font-size:12px;flex-wrap:wrap}
  .tel span{padding:3px 9px;border-radius:20px}
  .tel .g{background:var(--groen);color:#fff}
  .tel .n{background:var(--groen-licht);color:var(--groen-licht-tekst);border:1px solid var(--groen-licht-rand)}
  .tel .r{background:var(--rood-chip);color:var(--rood-chip-tekst)}
  .mij{margin-top:12px;padding-top:12px;border-top:1px solid var(--lijn)}
  .mij .lbl{font-size:12px;color:var(--grijs);margin-bottom:8px}
  .kies{display:flex;gap:8px}
  .kies button{flex:1;padding:10px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--lijn);background:#fff;color:var(--grijs)}
  .kies button.aan-in{background:var(--groen);color:#fff;border-color:var(--groen)}
  .kies button.aan-out{background:var(--rood-chip);color:var(--rood-chip-tekst);border-color:var(--rood-chip-rand)}
  .door{font-size:11px;color:var(--lichtgrijs);margin-top:6px}
  .roster-toggle{font-size:13px;color:var(--rood);cursor:pointer;margin-top:12px;display:inline-block}
  .roster{margin-top:10px;border-top:1px solid var(--lijn)}
  .rrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--lijn)}
  .rrow:last-child{border-bottom:none}
  .rrow .nm{flex:1;font-size:14px;font-weight:500}
  .chip{font-size:11px;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .chip.in{background:var(--groen);color:#fff}
  .chip.out{background:var(--rood-chip);color:var(--rood-chip-tekst)}
  .chip.none{background:var(--groen-licht);color:var(--groen-licht-tekst);border:1px solid var(--groen-licht-rand)}
  .mini{font-size:12px;color:var(--grijs);margin-top:2px}
  .verif{display:flex;gap:6px;align-items:center}
  .verif button{padding:5px 9px;border-radius:7px;font-size:12px;cursor:pointer;border:1px solid var(--lijn);background:#fff;color:var(--grijs)}
  .verif button.on-in{background:var(--groen);color:#fff;border-color:var(--groen)}
  .verif button.on-out{background:var(--rood-chip);color:var(--rood-chip-tekst);border-color:var(--rood-chip-rand)}
  .afw{font-size:10px;color:#854F0B;background:#FAEEDA;padding:3px 7px;border-radius:20px;white-space:nowrap}
  .center{text-align:center;color:var(--lichtgrijs);padding:24px;font-size:14px}
  .terug{font-size:14px;color:var(--rood);cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-bottom:4px}
  .detail-kop{font-size:20px;font-weight:600;margin:6px 0 2px}
  .detail-r{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--lijn);font-size:14px}
  .detail-r .l{color:var(--grijs);min-width:96px}
  nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;max-width:640px;margin:0 auto;
    background:#fff;border-top:1px solid var(--lijn);padding-bottom:env(safe-area-inset-bottom)}
  nav.tabbar button{flex:1;background:none;border:none;padding:9px 0 8px;color:var(--lichtgrijs);cursor:pointer;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav.tabbar button .ic{font-size:20px;line-height:1}
  nav.tabbar button.on{color:var(--rood);font-weight:600}
  .legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--grijs);margin:2px 0 10px}
  .legenda span span{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:0;margin-right:3px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="https://lirp.cdn-website.com/dfcb1f77/dms3rep/multi/opt/HCSLOGO-400h.png" alt="HCS">
    <div class="t"><div class="k">HC Schiedam</div><h1>MO9 Rood</h1></div>
    <button class="uit" id="uitknop" style="display:none" onclick="doUit()">Uitloggen</button>
  </header>
  <main id="app"><div class="center">Laden…</div></main>
  <nav class="tabbar" id="tabbar" style="display:none"></nav>
</div>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  GoogleAuthProvider, signInWithPopup, signOut, setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc,
  onSnapshot, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBiYoUzcPabkq-3CS7-aopWot-0RcuSdF0",
  authDomain: "mo9-rood.firebaseapp.com",
  projectId: "mo9-rood",
  storageBucket: "mo9-rood.firebasestorage.app",
  messagingSenderId: "205548091567",
  appId: "1:205548091567:web:6a7d4de55d90187e05bc5a",
  measurementId: "G-B0NEWWQTN1"
};
const ADMINS = ["grt.vndnbrg@gmail.com"];
const SPELERS = ["Kate van den Berg","Zephie Broekhuis","Wies Eggen de Koning","Sarah Gan",
  "Bobbie van der Horst","Marley Hilgeman","Helena Kraaijeveld","Ottilie Peters",
  "Jacky Verdouw","Fem van der Vlugt","Vera Dobrick"];
const THUISADRES = "Sportpark Harga, Olympiaweg 63, 3118 JD Schiedam";
const MAAND=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const DAG=["zo","ma","di","wo","do","vr","za"];
const DAGVOL=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
setPersistence(auth, browserLocalPersistence);

const el = document.getElementById("app");
const uitknop = document.getElementById("uitknop");
const tabbar = document.getElementById("tabbar");
let ME=null, MYUSER=null, PLAYERS=[], TAB="agenda";
let unsub=[];
const clearSubs=()=>{unsub.forEach(u=>{try{u()}catch(e){}}); unsub=[];};

window.doUit=()=>signOut(auth);
const isAdmin=()=> ME && ADMINS.includes((ME.email||"").toLowerCase());
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val=id=>document.getElementById(id).value.trim();
const slug=s=>(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"x";

onAuthStateChanged(auth, async user=>{
  ME=user;
  uitknop.style.display=user?"block":"none";
  tabbar.style.display="none";
  clearSubs();
  if(!user){ renderLogin(); return; }
  MYUSER=null;
  try{ const us=await getDoc(doc(db,"users",user.uid)); if(us.exists()) MYUSER=us.data(); }catch(e){}
  if(!isAdmin() && (!MYUSER||!MYUSER.playerId)){ await renderOnboarding(); return; }
  buildTabbar(); TAB="agenda"; route();
});

// ---------- LOGIN ----------
function renderLogin(){
  el.innerHTML=`
    <h2>Inloggen</h2>
    <div class="kaart">
      <input id="em" type="email" placeholder="E-mailadres" autocomplete="email">
      <input id="pw" type="password" placeholder="Wachtwoord" autocomplete="current-password">
      <button class="knop" id="inlog">Inloggen</button>
      <div id="fout"></div>
      <div style="margin-top:14px;text-align:center"><span class="link" id="maak">Nog geen account? Maak er een aan</span></div>
    </div>
    <button class="knop google" id="glog">Inloggen met Google</button>
    <p class="mini" style="text-align:center;margin-top:16px">Voor ouders van MO9 Rood. Je blijft na inloggen ingelogd op dit toestel.</p>`;
  document.getElementById("inlog").onclick=async()=>{try{await signInWithEmailAndPassword(auth,val("em"),val("pw"));}catch(e){fout(e);}};
  document.getElementById("glog").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider());}catch(e){fout(e);}};
  document.getElementById("maak").onclick=renderRegister;
}
function renderRegister(){
  el.innerHTML=`
    <h2>Account aanmaken</h2>
    <div class="kaart">
      <input id="em" type="email" placeholder="E-mailadres" autocomplete="email">
      <input id="pw" type="password" placeholder="Kies een wachtwoord (min. 6 tekens)" autocomplete="new-password">
      <button class="knop" id="reg">Account aanmaken</button>
      <div id="fout"></div>
      <div style="margin-top:14px;text-align:center"><span class="link" id="terug">Terug naar inloggen</span></div>
    </div>`;
  document.getElementById("reg").onclick=async()=>{try{await createUserWithEmailAndPassword(auth,val("em"),val("pw"));}catch(e){fout(e);}};
  document.getElementById("terug").onclick=renderLogin;
}
function fout(e){const f=document.getElementById("fout");if(!f)return;
  const m={"auth/invalid-credential":"E-mail of wachtwoord klopt niet.","auth/invalid-email":"Ongeldig e-mailadres.",
    "auth/weak-password":"Wachtwoord te kort (min. 6 tekens).","auth/email-already-in-use":"Er bestaat al een account met dit e-mailadres.",
    "auth/popup-closed-by-user":"Inloggen geannuleerd."}[e.code]||e.message;
  f.className="fout";f.textContent=m;}

// ---------- ONBOARDING (met ouder-naam, co-ouderschap) ----------
async function renderOnboarding(){
  await loadPlayers();
  el.innerHTML=`
    <h2>Koppel je account</h2>
    <div class="kaart">
      <p class="mini">Vul je naam in en kies je dochter. Twee ouders mogen aan hetzelfde kind koppelen — jullie kunnen dan allebei aan- en afmelden.</p>
      <label class="veldlbl">Jouw naam</label><input id="ounaam" placeholder="Voor- en achternaam">
      <label class="veldlbl">Je dochter</label>
      <select id="kind"><option value="">— kies —</option>
        ${PLAYERS.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
      <button class="knop" id="opslaan">Opslaan</button><div id="fout"></div>
    </div>
    ${PLAYERS.length?"":'<p class="mini" style="text-align:center">De teamlijst is nog niet ingesteld. Vraag de teammanager om dit te doen.</p>'}`;
  document.getElementById("opslaan").onclick=async()=>{
    const naam=val("ounaam"), pid=document.getElementById("kind").value;
    if(!naam||!pid){document.getElementById("fout").className="fout";document.getElementById("fout").textContent="Vul je naam in en kies je dochter.";return;}
    try{ await setDoc(doc(db,"users",ME.uid),{playerId:pid,email:ME.email,name:naam,ts:serverTimestamp()});
      MYUSER={playerId:pid,email:ME.email,name:naam}; buildTabbar(); TAB="agenda"; route();
    }catch(e){fout(e);}
  };
}
async function loadPlayers(){
  const snap=await getDocs(collection(db,"players"));
  PLAYERS=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));
}

// ---------- NAV ----------
function buildTabbar(){
  const tabs=[["agenda","📅","Agenda"],["aanmelden","✅","Aanmelden"],["diensten","🚗","Diensten"],["team","👥","Team"]];
  if(isAdmin()) tabs.push(["beheer","⚙️","Beheer"]);
  tabbar.style.display="flex";
  tabbar.innerHTML=tabs.map(t=>`<button data-tab="${t[0]}" class="${TAB===t[0]?'on':''}"><span class="ic">${t[1]}</span>${t[2]}</button>`).join("");
  tabbar.querySelectorAll("button").forEach(b=>b.onclick=()=>{TAB=b.dataset.tab; buildTabbar(); route();});
}
function route(){
  clearSubs(); window.scrollTo(0,0);
  if(TAB==="agenda") viewAgenda();
  else if(TAB==="aanmelden") viewAanmelden();
  else if(TAB==="diensten") viewDiensten();
  else if(TAB==="team") viewTeam();
  else if(TAB==="beheer") viewBeheer();
}

function activityStream(cb, includePast=false){
  const q=query(collection(db,"activities"),orderBy("date"));
  return onSnapshot(q,snap=>{
    const today=new Date();today.setHours(0,0,0,0);
    let acts=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!includePast) acts=acts.filter(a=>a.date&&new Date(a.date)>=today);
    cb(acts);
  });
}
function subline(a){
  const d=new Date(a.date);
  let s=`${DAG[d.getDay()]} ${d.getDate()} ${MAAND[d.getMonth()]}`;
  if(a.time) s+=` · ${a.time}`;
  if(a.type) s+=` · ${esc(a.type)}`;
  return s;
}
function titel(a){
  if(a.opponent){ const tu=a.homeAway?a.homeAway+' vs. ':''; return esc(tu+a.opponent); }
  return esc(a.title||"Activiteit");
}
function fmtTs(ts){ try{const d=ts.toDate?ts.toDate():new Date(ts);return `${d.getDate()} ${MAAND[d.getMonth()]} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;}catch(e){return"";} }

// ---------- AGENDA ----------
function viewAgenda(){
  el.innerHTML=`<h2>Agenda</h2><div id="lijst"><div class="center">Laden…</div></div>
    <div style="text-align:center;margin-top:6px"><span class="link" id="togpast">Toon eerdere activiteiten</span></div>`;
  let past=false;
  const bind=()=>{clearSubs(); const u=activityStream(acts=>{
      const L=document.getElementById("lijst"); if(!L)return;
      if(!acts.length){L.innerHTML=`<div class="kaart"><div class="center">Geen activiteiten.${isAdmin()?' Voeg er een toe onder Beheer.':''}</div></div>`;return;}
      const shown=past?acts.slice().reverse():acts;
      L.innerHTML=shown.map(a=>`<div class="kaart ${a.cancelled?'afg':''}"><div class="rij-item" data-id="${a.id}">
        <div class="datum"><div class="d">${new Date(a.date).getDate()}</div><div class="m">${MAAND[new Date(a.date).getMonth()]}</div></div>
        <div class="info"><div class="titel">${titel(a)}${a.cancelled?'<span class="tag-afg">Afgelast</span>':''}</div><div class="sub">${subline(a)}</div></div>
        <span class="pijl">›</span></div></div>`).join("");
      L.querySelectorAll("[data-id]").forEach(r=>r.onclick=()=>viewActivity(r.dataset.id));
    }, past); unsub.push(u);};
  bind();
  document.getElementById("togpast").onclick=(e)=>{past=!past;e.target.textContent=past?"Toon alleen komende":"Toon eerdere activiteiten";bind();};
}
async function viewActivity(id){
  clearSubs();
  const snap=await getDoc(doc(db,"activities",id));
  if(!snap.exists()){viewAgenda();return;}
  const a={id,...snap.data()};
  const d=new Date(a.date);
  const mapQ=(a.homeAway==='Uit'&&a.location)?a.location:THUISADRES;
  el.innerHTML=`
    <span class="terug" id="terug">‹ Agenda</span>
    <div class="detail-kop">${titel(a)}${a.cancelled?'<span class="tag-afg">Afgelast</span>':''}</div>
    <div class="mini">${DAGVOL[d.getDay()]} ${d.getDate()} ${MAAND[d.getMonth()]} ${d.getFullYear()}</div>
    <div class="kaart" style="margin-top:14px">
      ${a.time?row("Tijd",esc(a.time)):""}
      ${a.type?row("Type",esc(a.type)):""}
      ${a.opponent?row("Tegenstander",esc(a.opponent)):""}
      ${a.homeAway?row("Thuis/uit",esc(a.homeAway)):""}
      ${row("Locatie",esc(a.location||THUISADRES))}
    </div>
    <a class="knop uitlijn" id="ics">In mijn agenda zetten</a>
    <a class="knop grijs" target="_blank" rel="noopener" href="https://maps.google.com/?q=${encodeURIComponent(mapQ)}">Route in Google Maps</a>
    ${isAdmin()?`<a class="knop grijs" id="afgelast">${a.cancelled?'Afgelast ongedaan maken':'Markeer als afgelast'}</a>`:""}
    <div id="rsvpbox"></div>`;
  document.getElementById("terug").onclick=()=>{TAB="agenda";buildTabbar();route();};
  document.getElementById("ics").onclick=(e)=>{e.preventDefault();downloadICS(a);};
  if(isAdmin()){document.getElementById("afgelast").onclick=async(e)=>{e.preventDefault();
    try{await updateDoc(doc(db,"activities",id),{cancelled:!a.cancelled});viewActivity(id);}catch(err){alert(err.message);}};}
  if(!a.cancelled && MYUSER && MYUSER.playerId){
    const box=document.getElementById("rsvpbox");
    const u=onSnapshot(doc(db,"activities",id,"rsvp",MYUSER.playerId),ds=>{
      const data=ds.exists()?ds.data():null; const st=data?data.status:'none';
      const p=PLAYERS.find(x=>x.id===MYUSER.playerId);
      box.innerHTML=`<div class="mij"><div class="lbl">${p?esc(p.name):'Mijn dochter'} — ben je erbij? <span class="mini">(geen keuze = we gaan uit van aanwezig)</span></div>
        <div class="kies"><button class="${st==='in'?'aan-in':''}" data-s="in">Aanwezig</button>
        <button class="${st==='out'?'aan-out':''}" data-s="out">Afmelden</button></div>
        ${data&&data.by?`<div class="door">Laatst gewijzigd door ${esc(data.by)}${data.ts?' · '+fmtTs(data.ts):''}</div>`:''}</div>`;
      box.querySelectorAll("button").forEach(b=>b.onclick=()=>zetRsvp(id,MYUSER.playerId,b.dataset.s));
    });
    unsub.push(u);
  }
}
function row(l,v){return `<div class="detail-r"><div class="l">${l}</div><div>${v}</div></div>`;}
function downloadICS(a){
  const dt=a.date.replace(/-/g,"");let dtstart,dtend;
  if(a.time){const hm=a.time.replace(":","");dtstart="DTSTART:"+dt+"T"+hm+"00";
    let [h,m]=a.time.split(":").map(Number);let end=h*60+m+105;
    dtend="DTEND:"+dt+"T"+String(Math.floor(end/60)%24).padStart(2,"0")+String(end%60).padStart(2,"0")+"00";
  }else{dtstart="DTSTART;VALUE=DATE:"+dt;dtend="DTEND;VALUE=DATE:"+dt;}

    "SUMMARY:MO9 Rood — "+(a.opponent?(a.homeAway+" vs. "+a.opponent):a.title),"LOCATION:"+loc,"END:VEVENT","END:VCALENDAR"].join("\r\n");

  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;

  const banner=los.length?`<div class="fout">${los.length} kind(eren) zonder plek — meld een auto aan of deel ze in.</div>`:(cars.length?`<div class="meld">Iedereen heeft een plek ✓ · ${totVrij} stoel(en) over.</div>`:`<div class="mini">Nog geen auto's aangemeld.</div>`);
  const sb='width:26px;height:26px;border:1px solid var(--lijn);background:#fff;border-radius:7px;font-size:16px;cursor:pointer;line-height:1';
  const seg=`<div style="display:flex;background:#f1efe9;border-radius:10px;padding:3px;margin:10px 0 12px"><button id="dh" style="flex:1;border:none;border-radius:8px;padding:8px;font-size:13px;font-weight:600;cursor:pointer;background:${dir==='heen'?'#fff':'none'};color:${dir==='heen'?'var(--rood)':'var(--grijs)'}">Heen</button><button id="dt" style="flex:1;border:none;border-radius:8px;padding:8px;font-size:13px;font-weight:600;cursor:pointer;background:${dir==='terug'?'#fff':'none'};color:${dir==='terug'?'var(--rood)':'var(--grijs)'}">Terug</button></div>`;
  let zelf;
  if(!iAm){ zelf=`<div class="kaart"><b style="font-size:13px">Ik kan rijden</b>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px"><span style="font-size:13px;color:var(--grijs)">Plekken: <button id="sm" style="${sb}">−</button> <b>${cpSeats}</b> <button id="sp" style="${sb}">+</button></span><button id="aan" class="knop" style="width:auto;margin-top:0;padding:9px 16px">Aanmelden</button></div>
    <div class="mini" style="margin-top:6px">Je auto komt leeg binnen; jij deelt zelf kinderen in.</div></div>`;
  } else { zelf=`<div class="kaart" style="background:var(--groen-licht);border-color:var(--groen-licht-rand)"><div style="display:flex;align-items:center;gap:8px"><div style="flex:1"><b>Jij rijdt mee</b><div class="mini">Pas je plekken aan bij je auto</div></div><button id="af" class="knop grijs" style="width:auto;margin-top:0;padding:8px 13px">Ik kan toch niet</button></div></div>`; }
  const chip=(p,curcid)=>{ const opened=cpPick===p.id; let panel='';
    if(opened){ const curName=curcid?((cars.find(c=>c.id===curcid)||{}).name||''):''; const dests=cars.filter(c=>c.id!==curcid).map(c=>{const vrij=c.seats-kidsIn(c.id).length;return `<button data-assign="${p.id}|${c.id}" ${vrij<=0?'disabled':''} style="display:block;width:100%;text-align:left;border:none;background:none;padding:7px 4px;font-size:13px;cursor:${vrij<=0?'default':'pointer'};color:${vrij<=0?'var(--lichtgrijs)':'var(--tekst)'}">🚗 ${esc(c.name)} ${vrij>0?`· ${vrij} vrij`:'· vol'}</button>`;}).join('');
      const losOpt = curcid? `<button data-assign="${p.id}|_los" style="display:block;width:100%;text-align:left;border:none;background:none;padding:7px 4px;font-size:13px;cursor:pointer;color:var(--rood)">↩︎ Uit de auto (nog in te delen)</button>`:'';
      panel=`<div style="margin-top:6px;background:#faf9f6;border:1px solid var(--lijn);border-radius:10px;padding:6px 9px"><div class="mini" style="margin-bottom:2px">${esc(p.name)} → kies:</div>${curName?`<div class="mini" style="margin-bottom:4px">Zit nu bij <b>${esc(curName)}</b></div>`:''}${dests||'<div class="mini">Geen andere auto met plek</div>'}${losOpt}</div>`; }
    return `<div style="display:inline-block"><span data-pick="${p.id}" class="chip none" style="cursor:pointer">${esc(p.name)}</span>${panel}</div>`; };
  const carsHtml=cars.map(c=>{ const kids=kidsIn(c.id); const vrij=c.seats-kids.length, over=vrij<0, mine=c.id===ME.uid;
    return `<div class="kaart" style="${over?'border-color:#E24B4A':''}">
      <div style="display:flex;align-items:center;gap:8px"><div style="flex:1"><b>🚗 ${esc(c.name)}${mine?' (jij)':''}</b>
        <div class="mini" style="margin-top:3px">bezet ${kids.length} · plekken <button data-sm="${c.id}" style="${sb}">−</button> <b>${c.seats}</b> <button data-sp="${c.id}" style="${sb}">+</button>${over?' <span style="color:#791F1F">te vol!</span>':(vrij>0?` · ${vrij} vrij`:' · vol')}</div></div>
        <button data-klaar="${c.id}" style="border:1px solid ${c.klaar?'var(--groen)':'var(--lijn)'};background:${c.klaar?'var(--groen)':'#fff'};color:${c.klaar?'#fff':'var(--grijs)'};border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;align-self:flex-start">${c.klaar?'compleet ✓':'compleet?'}</button></div>
      <div style="margin-top:9px;display:flex;flex-wrap:wrap;gap:6px">${kids.map(p=>chip(p,c.id)).join('')||'<span class="mini">— nog leeg, deel kinderen in —</span>'}</div></div>`;}).join('');
  const losHtml=los.length?`<div class="kaart" style="border-style:dashed;border-color:#E24B4A"><div class="mini" style="color:#791F1F;font-weight:600;margin-bottom:6px">Nog in te delen — tik een kind om een auto te kiezen</div><div style="display:flex;flex-wrap:wrap;gap:6px">${los.map(p=>chip(p,null)).join('')}</div></div>`:'';
  el.innerHTML=`<span class="terug" id="terug">‹ Diensten</span>
    <div class="detail-kop">Carpool — ${titel(a)}</div><div class="mini">${subline(a)}</div>
    ${alle?'<div class="meld" style="text-align:center;margin-top:10px">✅ Alle wagens compleet — team is onderweg!</div>':''}
    ${seg}${banner}${lcHtml}${zelf}
    <div class="mini" style="margin:4px 0 8px">${dir==='heen'?'Heenreis':'Terugreis'}</div>
    ${carsHtml}${losHtml}
    <a class="knop" id="wabtn" style="background:#25D366">Kopieer voor WhatsApp</a><div id="wamsg"></div>
    <div class="mini" style="margin-top:12px;border-top:1px solid var(--lijn);padding-top:9px">Route naar ophaaladres en de rijbeurten-teller volgen zodra de contactgegevens in de app staan.</div>`;
  wireCarpool(data,cars);
}
function wireCarpool(data,cars){
  document.getElementById("terug").onclick=()=>{clearSubs();viewDiensten();};
  const dh=document.getElementById("dh"),dt=document.getElementById("dt");
  if(dh)dh.onclick=()=>{CP.dir='heen';subscribeCarpool();};
  if(dt)dt.onclick=()=>{CP.dir='terug';subscribeCarpool();};
  const sm=document.getElementById("sm"),sp=document.getElementById("sp");
  if(sm)sm.onclick=()=>{cpSeats=Math.max(1,cpSeats-1);drawCarpool(data);};
  if(sp)sp.onclick=()=>{cpSeats=Math.min(6,cpSeats+1);drawCarpool(data);};
  const aan=document.getElementById("aan");
  if(aan)aan.onclick=()=>cpSet({cars:{[ME.uid]:{name:(MYUSER&&MYUSER.name)||ME.email||"Ik",seats:cpSeats,klaar:false}}});
  const af=document.getElementById("af");
  if(af)af.onclick=()=>{ if(confirm("Weet je het zeker? Jouw auto valt weg en de kinderen komen zonder plek. Jij zorgt zelf voor vervanging en meldt het in de WhatsApp-groep.")){
    const upd={cars:{[ME.uid]:null},assign:{},lastChange:{kind:'jouw auto',naar:'uitgevallen',door:(MYUSER&&MYUSER.name)||ME.email||'Iemand',ts:Date.now()}}; CP.present.forEach(p=>{ if((data.assign||{})[p.id]===ME.uid) upd.assign[p.id]=null; }); cpSet(upd);} };
  document.querySelectorAll("[data-sm]").forEach(b=>b.onclick=()=>{const cid=b.dataset.sm;const c=cars.find(x=>x.id===cid);cpSet({cars:{[cid]:{seats:Math.max(1,c.seats-1)}}});});
  document.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{const cid=b.dataset.sp;const c=cars.find(x=>x.id===cid);cpSet({cars:{[cid]:{seats:Math.min(8,c.seats+1)}}});});
  document.querySelectorAll("[data-klaar]").forEach(b=>b.onclick=()=>{const cid=b.dataset.klaar;const c=cars.find(x=>x.id===cid);cpSet({cars:{[cid]:{klaar:!c.klaar}}});});
  document.querySelectorAll("[data-pick]").forEach(x=>x.onclick=()=>{cpPick=(cpPick===x.dataset.pick?null:x.dataset.pick);drawCarpool(data);});
  document.querySelectorAll("[data-assign]").forEach(b=>b.onclick=()=>{const p=b.dataset.assign.split('|');const pid=p[0],cid=p[1];const kind=(CP.present.find(x=>x.id===pid)||{}).name||pid;const naar=cid==='_los'?'nog in te delen':((cars.find(c=>c.id===cid)||{}).name||'auto');const door=(MYUSER&&MYUSER.name)||ME.email||'Iemand';cpPick=null;cpSet({assign:{[pid]: cid==='_los'?null:cid },lastChange:{kind,naar,door,ts:Date.now()}});});
  const wb=document.getElementById("wabtn");
  if(wb)wb.onclick=async(e)=>{e.preventDefault();const t=waText(data);const m=document.getElementById("wamsg");try{await navigator.clipboard.writeText(t);m.className="meld";m.textContent="Gekopieerd — plak het in de WhatsApp-groep.";}catch(err){m.className="meld";m.style.whiteSpace="pre-wrap";m.textContent="Selecteer en kopieer:\n"+t;}};
}
</script>
</body>
</html>
