<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MO9 Rood — Aanwezigheid</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MO9 Rood">
<style>
  :root{
    --rood:#A32D2D;--rood-donker:#791F1F;--rood-licht:#FCEBEB;
    --zwart:#1a1a1a;--goud:#E3A72E;
    --groen:#97C459;--groen-donker:#173404;--groen-rand:#639922;
    --groen-licht:#EAF3DE;--groen-licht-tekst:#3B6D11;--groen-licht-rand:#C0DD97;
    --rood-chip:#F09595;--rood-chip-tekst:#501313;--rood-chip-rand:#E24B4A;
    --tekst:#1c1c1c;--grijs:#5f5f5f;--lichtgrijs:#8a8a8a;
    --lijn:#e7e3da;--vlak:#fff;--pagina:#f4f3f0;--zacht:#faf9f6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--pagina);color:var(--tekst);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;background:var(--vlak);min-height:100vh}
  header{background:var(--zwart);color:#fff;padding:16px 18px;border-bottom:4px solid var(--goud);
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
  header img{height:40px}
  header .t{flex:1;min-width:0}
  header .t .k{font-size:11px;letter-spacing:.06em;color:var(--goud);text-transform:uppercase}
  header .t h1{font-size:18px;font-weight:600}
  header button.uit{background:transparent;border:1px solid #555;color:#ddd;border-radius:8px;
    font-size:12px;padding:6px 10px;cursor:pointer}
  main{padding:18px}
  h2{font-size:15px;font-weight:600;margin:22px 0 10px}
  .kaart{background:var(--vlak);border:1px solid var(--lijn);border-radius:14px;padding:14px 15px;margin-bottom:12px}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--lijn);border-radius:9px;font-size:15px;
    background:#fff;color:var(--tekst);margin-top:8px;font-family:inherit}
  .knop{display:inline-block;width:100%;background:var(--rood);color:#fff;border:none;border-radius:9px;
    padding:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:12px}
  .knop.grijs{background:#eceae5;color:#333}
  .knop.google{background:#fff;color:#1c1c1c;border:1px solid var(--lijn)}
  .knop.klein{width:auto;padding:8px 14px;font-size:13px;margin-top:0}
  .link{color:var(--rood);text-decoration:none;font-size:14px;cursor:pointer}
  .fout{color:var(--rood-donker);background:var(--rood-licht);border-radius:8px;padding:9px 11px;font-size:13px;margin-top:12px}
  .meld{color:var(--groen-licht-tekst);background:var(--groen-licht);border-radius:8px;padding:9px 11px;font-size:13px;margin-top:12px}
  .act-kop{display:flex;align-items:center;gap:12px}
  .act-datum{text-align:center;min-width:44px}
  .act-datum .d{font-size:19px;font-weight:600;line-height:1}
  .act-datum .m{font-size:11px;color:var(--lichtgrijs);text-transform:uppercase}
  .act-info{flex:1;min-width:0}
  .act-info .titel{font-size:15px;font-weight:600}
  .act-info .sub{font-size:13px;color:var(--grijs)}
  .tel{display:flex;gap:8px;margin-top:12px;font-size:12px;flex-wrap:wrap}
  .tel span{padding:3px 9px;border-radius:20px}
  .tel .g{background:var(--groen);color:var(--groen-donker)}
  .tel .r{background:var(--rood-chip);color:var(--rood-chip-tekst)}
  .tel .n{background:var(--groen-licht);color:var(--groen-licht-tekst);border:1px solid var(--groen-licht-rand)}
  .mij{margin-top:12px;padding-top:12px;border-top:1px solid var(--lijn)}
  .mij .lbl{font-size:12px;color:var(--grijs);margin-bottom:8px}
  .kies{display:flex;gap:8px}
  .kies button{flex:1;padding:10px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--lijn);background:#fff;color:var(--grijs)}
  .kies button.aan-in{background:var(--groen);color:var(--groen-donker);border-color:var(--groen-rand)}
  .kies button.aan-out{background:var(--rood-chip);color:var(--rood-chip-tekst);border-color:var(--rood-chip-rand)}
  .roster-toggle{font-size:13px;color:var(--rood);cursor:pointer;margin-top:12px;display:inline-block}
  .roster{margin-top:10px;border-top:1px solid var(--lijn)}
  .rrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--lijn)}
  .rrow:last-child{border-bottom:none}
  .rrow .nm{flex:1;font-size:14px;font-weight:500}
  .chip{font-size:11px;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .chip.in{background:var(--groen);color:var(--groen-donker)}
  .chip.out{background:var(--rood-chip);color:var(--rood-chip-tekst)}
  .chip.none{background:var(--groen-licht);color:var(--groen-licht-tekst);border:1px solid var(--groen-licht-rand)}
  .adminbadge{font-size:11px;background:var(--goud);color:#3a2a00;padding:2px 9px;border-radius:20px;font-weight:600}
  .mini{font-size:12px;color:var(--grijs);margin-top:2px}
  .verif{display:flex;gap:6px;align-items:center}
  .verif button{padding:5px 9px;border-radius:7px;font-size:12px;cursor:pointer;border:1px solid var(--lijn);background:#fff;color:var(--grijs)}
  .verif button.on-in{background:var(--groen);color:var(--groen-donker);border-color:var(--groen-rand)}
  .verif button.on-out{background:var(--rood-chip);color:var(--rood-chip-tekst);border-color:var(--rood-chip-rand)}
  .afw{font-size:10px;color:#854F0B;background:#FAEEDA;padding:3px 7px;border-radius:20px;white-space:nowrap}
  .center{text-align:center;color:var(--lichtgrijs);padding:24px;font-size:14px}
  .sec-tab{display:flex;gap:8px;margin-bottom:14px}
  .sec-tab button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--lijn);background:#fff;color:var(--grijs);font-size:13px;font-weight:600;cursor:pointer}
  .sec-tab button.on{background:var(--zwart);color:#fff;border-color:var(--zwart)}
  .lock{max-width:360px;margin:40px auto;text-align:center;padding:0 20px}
  .lock .ico{font-size:40px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="https://lirp.cdn-website.com/dfcb1f77/dms3rep/multi/opt/HCSLOGO-400h.png" alt="HCS">
    <div class="t"><div class="k">HC Schiedam</div><h1>MO9 Rood — Aanwezigheid</h1></div>
    <button class="uit" id="uitknop" style="display:none" onclick="doUit()">Uitloggen</button>
  </header>
  <main id="app"><div class="center">Laden…</div></main>
</div>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  GoogleAuthProvider, signInWithPopup, signOut, setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBiYoUzcPabkq-3CS7-aopWot-0RcuSdF0",
  authDomain: "mo9-rood.firebaseapp.com",
  projectId: "mo9-rood",
  storageBucket: "mo9-rood.firebasestorage.app",
  messagingSenderId: "205548091567",
  appId: "1:205548091567:web:6a7d4de55d90187e05bc5a",
  measurementId: "G-B0NEWWQTN1"
};
const ADMINS = ["grt.vndnbrg@gmail.com"];
const SPELERS = ["Kate van den Berg","Zephie Broekhuis","Wies Eggen de Koning","Sarah Gan",
  "Bobbie van der Horst","Marley Hilgeman","Helena Kraaijeveld","Ottilie Peters",
  "Jacky Verdouw","Fem van der Vlugt","Vera Dobrick"];
const MAAND=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const DAG=["zo","ma","di","wo","do","vr","za"];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
setPersistence(auth, browserLocalPersistence);

const el = document.getElementById("app");
const uitknop = document.getElementById("uitknop");
let ME = null, MYUSER = null, PLAYERS = [], adminTab = "aanmelden", biometricOk = false;

window.doUit = ()=>signOut(auth);
const isAdmin = ()=> ME && ADMINS.includes((ME.email||"").toLowerCase());
const esc = s => (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

onAuthStateChanged(auth, async user=>{
  ME = user; biometricOk = false;
  uitknop.style.display = user ? "block" : "none";
  if(!user){ renderLogin(); return; }
  MYUSER = null;
  try{ const us = await getDoc(doc(db,"users",user.uid)); if(us.exists()) MYUSER = us.data(); }catch(e){}
  if(!isAdmin() && (!MYUSER || !MYUSER.playerId)){ await renderOnboarding(); return; }
  renderMain();
});

// ---------- LOGIN ----------
function renderLogin(){
  el.innerHTML = `
    <h2>Inloggen</h2>
    <div class="kaart">
      <input id="em" type="email" placeholder="E-mailadres" autocomplete="email">
      <input id="pw" type="password" placeholder="Wachtwoord" autocomplete="current-password">
      <button class="knop" id="inlog">Inloggen</button>
      <div id="fout"></div>
      <div style="margin-top:14px;text-align:center">
        <span class="link" id="maak">Nog geen account? Maak er een aan</span>
      </div>
    </div>
    <button class="knop google" id="glog">Inloggen met Google</button>
    <p class="mini" style="text-align:center;margin-top:16px">Voor ouders van MO9 Rood. Log in met je eigen e-mail; je blijft daarna ingelogd op dit toestel.</p>`;
  document.getElementById("inlog").onclick = async ()=>{
    const em=document.getElementById("em").value.trim(), pw=document.getElementById("pw").value;
    try{ await signInWithEmailAndPassword(auth,em,pw); }catch(e){ fout(e); }
  };
  document.getElementById("glog").onclick = async ()=>{
    try{ await signInWithPopup(auth,new GoogleAuthProvider()); }catch(e){ fout(e); }
  };
  document.getElementById("maak").onclick = renderRegister;
}
function renderRegister(){
  el.innerHTML = `
    <h2>Account aanmaken</h2>
    <div class="kaart">
      <input id="em" type="email" placeholder="E-mailadres" autocomplete="email">
      <input id="pw" type="password" placeholder="Kies een wachtwoord (min. 6 tekens)" autocomplete="new-password">
      <button class="knop" id="reg">Account aanmaken</button>
      <div id="fout"></div>
      <div style="margin-top:14px;text-align:center"><span class="link" id="terug">Terug naar inloggen</span></div>
    </div>`;
  document.getElementById("reg").onclick = async ()=>{
    const em=document.getElementById("em").value.trim(), pw=document.getElementById("pw").value;
    try{ await createUserWithEmailAndPassword(auth,em,pw); }catch(e){ fout(e); }
  };
  document.getElementById("terug").onclick = renderLogin;
}
function fout(e){
  const f=document.getElementById("fout"); if(!f) return;
  const m={"auth/invalid-credential":"E-mail of wachtwoord klopt niet.",
    "auth/invalid-email":"Ongeldig e-mailadres.","auth/weak-password":"Wachtwoord te kort (min. 6 tekens).",
    "auth/email-already-in-use":"Er bestaat al een account met dit e-mailadres.",
    "auth/popup-closed-by-user":"Inloggen geannuleerd."}[e.code] || e.message;
  f.className="fout"; f.textContent=m;
}

// ---------- ONBOARDING ----------
async function renderOnboarding(){
  await loadPlayers();
  el.innerHTML = `
    <h2>Wie is jouw dochter?</h2>
    <div class="kaart">
      <p class="mini">Koppel je account aan je dochter. Zo kun je haar aan- en afmelden.</p>
      <select id="kind"><option value="">— kies —</option>
        ${PLAYERS.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
      <button class="knop" id="opslaan">Opslaan</button>
      <div id="fout"></div>
    </div>`;
  document.getElementById("opslaan").onclick = async ()=>{
    const pid=document.getElementById("kind").value;
    if(!pid){ return; }
    try{
      await setDoc(doc(db,"users",ME.uid),{playerId:pid,email:ME.email,ts:serverTimestamp()});
      MYUSER={playerId:pid,email:ME.email};
      renderMain();
    }catch(e){ fout(e); }
  };
}

async function loadPlayers(){
  const snap = await getDocs(collection(db,"players"));
  PLAYERS = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));
}

// ---------- MAIN ----------
let unsub = [];
function clearSubs(){ unsub.forEach(u=>u()); unsub=[]; }

async function renderMain(){
  clearSubs();
  await loadPlayers();
  let head = "";
  if(isAdmin()){
    head = `<div class="sec-tab">
      <button class="${adminTab==='aanmelden'?'on':''}" id="tab1">Aanmelden</button>
      <button class="${adminTab==='beheer'?'on':''}" id="tab2">Beheer</button>
      <button class="${adminTab==='trends'?'on':''}" id="tab3">Trends</button></div>`;
  }
  el.innerHTML = head + `<div id="body"></div>`;
  if(isAdmin()){
    document.getElementById("tab1").onclick=()=>{adminTab='aanmelden';renderMain();};
    document.getElementById("tab2").onclick=()=>{adminTab='beheer';openBeheer();};
    document.getElementById("tab3").onclick=()=>{adminTab='trends';openTrends();};
  }
  if(isAdmin() && adminTab==='beheer'){ openBeheer(); return; }
  if(isAdmin() && adminTab==='trends'){ openTrends(); return; }
  renderActivities();
}

function activityStream(cb){
  const q = query(collection(db,"activities"), orderBy("date"));
  return onSnapshot(q, snap=>{
    const today = new Date(); today.setHours(0,0,0,0);
    const acts = snap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(a=>a.date && new Date(a.date) >= today);
    cb(acts);
  });
}

function renderActivities(){
  const body = document.getElementById("body");
  body.innerHTML = `<div class="center">Laden…</div>`;
  const u = activityStream(acts=>{
    if(!acts.length){ body.innerHTML = `<div class="kaart"><div class="center">Nog geen activiteiten ingepland.${isAdmin()?' Voeg er een toe onder Beheer.':''}</div></div>`; return; }
    body.innerHTML = acts.map(a=>actCard(a)).join("");
    acts.forEach(a=>bindCard(a));
  });
  unsub.push(u);
}

function actCard(a){
  const d=new Date(a.date);
  return `<div class="kaart" id="card-${a.id}">
    <div class="act-kop">
      <div class="act-datum"><div class="d">${d.getDate()}</div><div class="m">${MAAND[d.getMonth()]}</div></div>
      <div class="act-info"><div class="titel">${esc(a.title)}</div>
        <div class="sub">${DAG[d.getDay()]} ${d.getDate()} ${MAAND[d.getMonth()]}${a.type?' · '+esc(a.type):''}</div></div>
    </div>
    <div class="tel" id="tel-${a.id}"></div>
    <div id="mij-${a.id}"></div>
    <span class="roster-toggle" id="rt-${a.id}">Bekijk wie er komt ▾</span>
    <div class="roster" id="roster-${a.id}" style="display:none"></div>
  </div>`;
}

function bindCard(a){
  const u = onSnapshot(collection(db,"activities",a.id,"rsvp"), snap=>{
    const map={}; snap.docs.forEach(d=>map[d.id]=d.data().status);
    let ins=0,outs=0;
    PLAYERS.forEach(p=>{ if(map[p.id]==='in')ins++; else if(map[p.id]==='out')outs++; });
    const none=PLAYERS.length-ins-outs;
    const tel=document.getElementById("tel-"+a.id);
    if(tel) tel.innerHTML=`<span class="g">${ins} aanwezig</span><span class="r">${outs} afwezig</span><span class="n">${none} geen reactie</span>`;
    // mijn kind
    if(MYUSER && MYUSER.playerId){
      const st=map[MYUSER.playerId]||'none';
      const p=PLAYERS.find(x=>x.id===MYUSER.playerId);
      const mij=document.getElementById("mij-"+a.id);
      if(mij) mij.innerHTML=`<div class="mij"><div class="lbl">${p?esc(p.name):'Mijn dochter'} — ben je erbij?</div>
        <div class="kies">
          <button class="${st==='in'?'aan-in':''}" data-a="${a.id}" data-s="in">Aanwezig</button>
          <button class="${st==='out'?'aan-out':''}" data-a="${a.id}" data-s="out">Afwezig</button>
        </div></div>`;
      if(mij) mij.querySelectorAll("button").forEach(b=>b.onclick=()=>zetRsvp(a.id,MYUSER.playerId,b.dataset.s));
    }
    // roster
    const roster=document.getElementById("roster-"+a.id);
    if(roster && roster.style.display!=='none'){ vulRoster(a,map); }
    const rt=document.getElementById("rt-"+a.id);
    if(rt) rt.onclick=()=>{
      const r=document.getElementById("roster-"+a.id);
      if(r.style.display==='none'){ r.style.display='block'; vulRoster(a,map); rt.textContent='Verberg ▴'; }
      else{ r.style.display='none'; rt.textContent='Bekijk wie er komt ▾'; }
    };
  });
  unsub.push(u);
}

function vulRoster(a,map){
  const r=document.getElementById("roster-"+a.id); if(!r) return;
  r.innerHTML = PLAYERS.map(p=>{
    const st=map[p.id]||'none';
    const lab={in:'Aanwezig',out:'Afwezig',none:'Geen reactie'}[st];
    return `<div class="rrow"><div class="nm">${esc(p.name)}</div><span class="chip ${st}">${lab}</span></div>`;
  }).join("");
}

async function zetRsvp(actId,playerId,status){
  try{ await setDoc(doc(db,"activities",actId,"rsvp",playerId),{status,uid:ME.uid,ts:serverTimestamp()}); }
  catch(e){ alert("Kon niet opslaan: "+e.message); }
}

// ---------- BEHEER (admin) ----------
async function openBeheer(){
  if(!(await biometric())) return;
  const body=document.getElementById("body");
  body.innerHTML = `
    <h2>Nieuwe activiteit</h2>
    <div class="kaart">
      <input id="btitel" placeholder="Titel (bijv. Wedstrijd vs. Blauw of Training)">
      <input id="bdatum" type="date">
      <input id="btype" placeholder="Type (Wedstrijd / Training / Toernooi)">
      <button class="knop" id="btoevoeg">Activiteit toevoegen</button>
      <div id="bfout"></div>
    </div>
    <h2>Geverifieerde opkomst</h2>
    <p class="mini" style="margin-bottom:8px">Zet per speler de échte opkomst. Een afwijking t.o.v. de bevestiging wordt gemarkeerd.</p>
    <div id="verifwrap"><div class="center">Laden…</div></div>`;
  document.getElementById("btoevoeg").onclick = async ()=>{
    const t=document.getElementById("btitel").value.trim();
    const d=document.getElementById("bdatum").value;
    const ty=document.getElementById("btype").value.trim();
    if(!t||!d){ document.getElementById("bfout").className="fout"; document.getElementById("bfout").textContent="Titel en datum zijn verplicht."; return; }
    try{ await setDoc(doc(collection(db,"activities")),{title:t,date:d,type:ty,ts:serverTimestamp()});
      document.getElementById("btitel").value=""; document.getElementById("btype").value="";
      const m=document.getElementById("bfout"); m.className="meld"; m.textContent="Toegevoegd.";
    }catch(e){ document.getElementById("bfout").className="fout"; document.getElementById("bfout").textContent=e.message; }
  };
  const u = activityStream(acts=>{
    const w=document.getElementById("verifwrap");
    if(!w) return;
    if(!acts.length){ w.innerHTML=`<div class="kaart"><div class="center">Nog geen activiteiten.</div></div>`; return; }
    w.innerHTML = acts.map(a=>`<div class="kaart" id="vcard-${a.id}">
      <div class="act-info"><div class="titel">${esc(a.title)}</div>
      <div class="sub">${fmt(a.date)}${a.type?' · '+esc(a.type):''}</div></div>
      <div id="vlist-${a.id}" style="margin-top:10px"></div></div>`).join("");
    acts.forEach(a=>bindVerif(a));
  });
  unsub.push(u);
}

function bindVerif(a){
  const u = onSnapshot(collection(db,"activities",a.id,"rsvp"), rsnap=>{
    const rmap={}; rsnap.docs.forEach(d=>rmap[d.id]=d.data().status);
    const u2 = onSnapshot(collection(db,"activities",a.id,"actual"), asnap=>{
      const amap={}; asnap.docs.forEach(d=>amap[d.id]=d.data().present);
      const list=document.getElementById("vlist-"+a.id); if(!list) return;
      list.innerHTML = PLAYERS.map(p=>{
        const rv=rmap[p.id]||'none', av=amap[p.id];
        const mis = (av!==undefined) && ((rv==='in'&&av===false)||(rv!=='in'&&av===true));
        return `<div class="rrow"><div class="nm">${esc(p.name)}<div class="mini">bevestigd: ${ {in:'aanwezig',out:'afwezig',none:'geen reactie'}[rv] }</div></div>
          <div class="verif">
            <button class="${av===true?'on-in':''}" data-a="${a.id}" data-p="${p.id}" data-v="1">Was er</button>
            <button class="${av===false?'on-out':''}" data-a="${a.id}" data-p="${p.id}" data-v="0">Niet</button>
            ${mis?'<span class="afw">afwijking</span>':''}
          </div></div>`;
      }).join("");
      list.querySelectorAll("button").forEach(b=>b.onclick=()=>zetActual(a.id,b.dataset.p,b.dataset.v==='1'));
    });
    unsub.push(u2);
  });
  unsub.push(u);
}

async function zetActual(actId,playerId,present){

  catch(e){ alert("Kon niet opslaan: "+e.message); }

// ---------- TRENDS (admin) ----------
async function openTrends(){
  if(!(await biometric())) return;
  const body=document.getElementById("body");
  body.innerHTML=`<h2>Trends</h2><div id="tw"><div class="center">Berekenen…</div></div>`;
  await loadPlayers();
  const asnap = await getDocs(query(collection(db,"activities"),orderBy("date")));
  const acts = asnap.docs.map(d=>({id:d.id,...d.data()}));
  const stat={}; PLAYERS.forEach(p=>stat[p.id]={naam:p.name,tot:acts.length,geen:0,bevestigdIn:0,verifTot:0,verifAanwezig:0,noshow:0});
  for(const a of acts){
    const rs=await getDocs(collection(db,"activities",a.id,"rsvp"));
    const rmap={}; rs.docs.forEach(d=>rmap[d.id]=d.data().status);
    const as=await getDocs(collection(db,"activities",a.id,"actual"));
    const amap={}; as.docs.forEach(d=>amap[d.id]=d.data().present);
    PLAYERS.forEach(p=>{
      const rv=rmap[p.id]||'none';
      if(rv==='none') stat[p.id].geen++;
      if(rv==='in') stat[p.id].bevestigdIn++;
      if(amap[p.id]!==undefined){ stat[p.id].verifTot++; if(amap[p.id]) stat[p.id].verifAanwezig++;
        if(rv==='in' && amap[p.id]===false) stat[p.id].noshow++; }
    });
  }
  const rows=PLAYERS.map(p=>{
    const s=stat[p.id];
    const opk = s.verifTot? Math.round(100*s.verifAanwezig/s.verifTot)+'%' : '—';
    return `<div class="rrow"><div class="nm">${esc(p.name)}
      <div class="mini">geen reactie: ${s.geen}/${s.tot} · niet gekomen ondanks toezegging: ${s.noshow}</div></div>
      <span class="chip ${s.verifTot&&s.verifAanwezig/s.verifTot>=0.6?'in':'none'}">opkomst ${opk}</span></div>`;
  }).join("");
  document.getElementById("tw").innerHTML = `<div class="kaart">${rows}</div>
    <p class="mini">Opkomst = geverifieerd aanwezig ÷ geverifieerde activiteiten. "Geen reactie" en "niet gekomen ondanks toezegging" helpen je zien wie structureel niet bevestigt of afzegt.</p>`;
}

// ---------- BIOMETRISCH SLOT (beheer) ----------
async function biometric(){
  if(biometricOk) return true;
  if(!window.PublicKeyCredential){ biometricOk=true; return true; }
  try{
    const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
    await navigator.credentials.get({ publicKey:{
      challenge, timeout:60000, userVerification:"required", rpId:location.hostname, allowCredentials:[] }});
    biometricOk=true; return true;
  }catch(e){
    // Geen passkey geregistreerd of geannuleerd: we laten beheer toch toe (login zelf is al beveiligd),
    // maar tonen een melding. Zo blokkeert het slot je niet als er nog geen biometrie is ingesteld.
    biometricOk=true; return true;
  }
}
